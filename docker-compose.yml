services:
  # Same database engine as production (Supabase is PostgreSQL).
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: laundry_db
      POSTGRES_USER: laundry_user
      POSTGRES_PASSWORD: laundry_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundry_user -d laundry_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    # Optional local settings such as the Firebase credentials. Values under `environment`
    # take precedence, so the container keeps using the compose database and Redis.
    env_file:
      - path: ./server/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://laundry_user:laundry_pass@postgres:5432/laundry_db
      DIRECT_URL: postgresql://laundry_user:laundry_pass@postgres:5432/laundry_db
      BE_PORT: 5000
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      args:
        # Baked in at build time (Next.js inlines NEXT_PUBLIC_* vars). Runs in
        # the browser, so it must be reachable from the host, not the Docker
        # network - "server" wouldn't resolve outside the compose network.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
        # Supabase Auth (Project settings > API: URL and anon key), from your shell or a .env
        # file next to this compose file.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  postgres_data:
