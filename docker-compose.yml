services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laundry_db
      MYSQL_USER: laundry_user
      MYSQL_PASSWORD: laundry_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://laundry_user:laundry_pass@mysql:3306/laundry_db
      BE_PORT: 5000
      SESSION_SECRET: replace-with-a-strong-secret
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      args:
        # Baked in at build time (Next.js inlines NEXT_PUBLIC_* vars). Runs in
        # the browser, so it must be reachable from the host, not the Docker
        # network - "server" wouldn't resolve outside the compose network.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  mysql_data:
