# Netlify build for the Next.js client (Add new site > Import from Git, pick this repo).
# Netlify detects Next.js and runs it with its Next.js runtime, so pages, the proxy (route
# protection) and server rendering all work without extra configuration.
[build]
  base = "client"
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer.
  NODE_VERSION = "22"
  # Set NEXT_PUBLIC_API_BASE_URL in Site configuration > Environment variables to the Render
  # API URL (e.g. https://panda-laundry-api.onrender.com). It is baked in at build time, so
  # trigger a new deploy after changing it.
